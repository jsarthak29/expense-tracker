<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="shell topbar__inner">
    <div class="topbar__titles">
      <h1>Expense Tracker</h1>
      <p class="subtitle">Personal finance overview</p>
    </div>
    <button type="button" id="open-add" class="btn btn--primary">
      <span aria-hidden="true">+</span> Add Expense
    </button>
  </div>
</header>

<main class="shell">

  <div id="error-banner" class="banner" role="alert" hidden>
    <div class="banner__body">
      <strong class="banner__title">Something went wrong</strong>
      <span id="error-text" class="banner__detail"></span>
    </div>
    <button type="button" id="error-dismiss" class="banner__close" aria-label="Dismiss">&times;</button>
  </div>

  <!-- Monthly summary -->
  <section class="card">
    <div class="card__head">
      <h2 class="card__title">Monthly summary</h2>
      <label class="field field--inline">
        <span class="field__label">Month</span>
        <input type="month" id="summary-month" />
      </label>
    </div>

    <div class="summary">
      <div class="summary__headline">
        <span class="summary__label">Total spend</span>
        <span id="summary-total" class="summary__amount">&mdash;</span>
        <span id="summary-meta" class="summary__meta"></span>
      </div>
      <div id="breakdown" class="breakdown"></div>
    </div>
  </section>

  <!-- Expenses -->
  <section class="card">
    <div class="card__head">
      <h2 class="card__title">Expenses</h2>
      <span id="result-count" class="card__meta"></span>
    </div>

    <form id="filter-form" class="filters">
      <label class="field field--grow">
        <span class="field__label">Search</span>
        <input name="q" placeholder="Title or notes" autocomplete="off" />
      </label>
      <label class="field">
        <span class="field__label">Category</span>
        <select name="category">
          <option value="">All categories</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Utilities">Utilities</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Shopping">Shopping</option>
          <option value="Health">Health</option>
          <option value="Rent">Rent</option>
          <option value="Travel">Travel</option>
          <option value="__blank__">Uncategorized</option>
        </select>
      </label>
      <label class="field">
        <span class="field__label">Date from</span>
        <input type="date" name="date_from" />
      </label>
      <label class="field">
        <span class="field__label">Date to</span>
        <input type="date" name="date_to" />
      </label>
      <label class="field">
        <span class="field__label">Min &#8377;</span>
        <input type="number" step="0.01" min="0" name="amount_min" placeholder="0" />
      </label>
      <label class="field">
        <span class="field__label">Max &#8377;</span>
        <input type="number" step="0.01" min="0" name="amount_max" placeholder="Any" />
      </label>
      <label class="field">
        <span class="field__label">Sort by</span>
        <select name="sort">
          <option value="date">Date</option>
          <option value="amount">Amount</option>
          <option value="title">Description</option>
          <option value="category">Category</option>
        </select>
      </label>
      <label class="field">
        <span class="field__label">Order</span>
        <select name="order">
          <option value="desc">Descending</option>
          <option value="asc">Ascending</option>
        </select>
      </label>
      <div class="filters__actions">
        <button type="submit" class="btn btn--primary">Apply</button>
        <button type="button" id="filter-reset" class="btn">Reset</button>
      </div>
    </form>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th scope="col">Date</th>
            <th scope="col">Description</th>
            <th scope="col">Category</th>
            <th scope="col" class="num">Amount</th>
            <th scope="col" class="actions-col"><span class="sr-only">Action</span></th>
          </tr>
        </thead>
        <tbody id="expenses-tbody"></tbody>
      </table>
    </div>

    <div class="pagination">
      <button type="button" id="page-prev" class="btn">&larr; Previous</button>
      <span id="page-info" class="pagination__info">&mdash;</span>
      <button type="button" id="page-next" class="btn">Next &rarr;</button>
    </div>
  </section>

</main>

<footer class="shell footer">
  <p>Vanilla HTML, CSS and JavaScript &mdash; no build step, no dependencies. API contract: <code>contract/openapi.yaml</code>.</p>
</footer>

<!-- Add expense modal -->
<div id="add-modal" class="modal" hidden>
  <div class="modal__backdrop" data-close-modal></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="add-modal-title">
    <div class="modal__head">
      <h2 id="add-modal-title">Add expense</h2>
      <button type="button" class="modal__close" data-close-modal aria-label="Close">&times;</button>
    </div>

    <form id="add-form" class="modal__form" novalidate>
      <div id="add-error" class="form-error" hidden></div>

      <label class="field field--full">
        <span class="field__label">Description <span class="req">*</span></span>
        <input name="title" required maxlength="255" autocomplete="off" placeholder="Lunch at Toit" />
      </label>

      <label class="field">
        <span class="field__label">Amount (&#8377;) <span class="req">*</span></span>
        <input name="amount" required type="number" step="0.01" min="0.01" placeholder="0.00" />
      </label>

      <label class="field">
        <span class="field__label">Date <span class="req">*</span></span>
        <input name="date" required type="date" />
      </label>

      <label class="field field--full">
        <span class="field__label">Category</span>
        <input name="category" list="category-options" maxlength="64" autocomplete="off"
               placeholder="Leave blank if uncategorized" />
        <datalist id="category-options">
          <option value="Food"></option>
          <option value="Transport"></option>
          <option value="Utilities"></option>
          <option value="Entertainment"></option>
          <option value="Shopping"></option>
          <option value="Health"></option>
          <option value="Rent"></option>
          <option value="Travel"></option>
        </datalist>
      </label>

      <label class="field field--full">
        <span class="field__label">Notes</span>
        <input name="notes" autocomplete="off" placeholder="Optional" />
      </label>

      <div class="modal__actions">
        <button type="button" class="btn" data-close-modal>Cancel</button>
        <button type="submit" id="add-submit" class="btn btn--primary">Save expense</button>
      </div>
    </form>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
